name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Select Rust toolchain
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Install dependency auditor
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo audit

  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: api/requirements.txt
      - name: Install dependencies
        # starlette's TestClient needs an HTTP client at test time only, so it
        # stays out of api/requirements.txt and the runtime image. Which
        # package it wants depends on the starlette version, so install both.
        run: python -m pip install -r api/requirements.txt pytest pip-audit httpx httpx2
      - name: Test gateway contract
        env:
          # The gateway refuses to start unauthenticated unless told to. These
          # contract tests cover query forwarding, not auth; auth itself is
          # covered by tests/test_gateway_auth.py, which sets its own env.
          GATEWAY_ALLOW_UNAUTHENTICATED: "true"
        run: python -m pytest -q tests/test_gateway_contract.py tests/test_gateway_auth.py
      - name: Audit Python dependencies
        run: python -m pip_audit -r api/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=high
